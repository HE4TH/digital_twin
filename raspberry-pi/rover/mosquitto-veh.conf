# /etc/mosquitto/conf.d/veh.conf
# 디지털 트윈 로버용 브로커 설정 (라즈베리파이)
#
# 설치:
#   sudo cp ~/mosquitto-veh.conf /etc/mosquitto/conf.d/veh.conf
#   sudo systemctl restart mosquitto
#
# 확인:
#   ss -tlnp | grep -E '1883|9001'

# --- TCP: Pi 내부 프로그램 + Windows 의 Unreal 이 붙는다 ---
listener 1883 0.0.0.0
protocol mqtt

# --- WebSocket: 브라우저와 휴대폰이 붙는다 ---
listener 9001 0.0.0.0
protocol websockets

# 교육/개발용. 같은 Wi-Fi 안에서만 쓰고 공용망에 노출하지 않는다.
allow_anonymous true

# 제어 스트림은 QoS 0 이라 디스크 보존이 필요 없다.
persistence false
