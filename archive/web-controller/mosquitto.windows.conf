# mosquitto.windows.conf
# Unreal MQTT Vehicle Bridge - 개발용 로컬 브로커 (Windows)
#
# 실행:  start-broker.bat
# 수동:  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.windows.conf -v

# ---------------------------------------------------------------------------
# TCP listener - Unreal 전용. 루프백으로만 묶어 외부 노출을 막는다.
# ---------------------------------------------------------------------------
listener 1883 127.0.0.1
protocol mqtt

# ---------------------------------------------------------------------------
# WebSocket listener - 브라우저/휴대폰용.
#
# 주의: 여기를 현재 Wi-Fi IP 로 못박지 말 것.
#   - 같은 PC 브라우저가 localhost 로 접속하면 붙지 못한다.
#   - DHCP 로 IP 가 바뀔 때마다 이 파일을 다시 고쳐야 한다.
# 0.0.0.0 으로 열고, 노출 범위는 Windows 방화벽(사설 네트워크만 허용)으로 통제한다.
# ---------------------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# ---------------------------------------------------------------------------
# 개발 전용 설정. 공용 네트워크나 공개 배포에는 이대로 쓰지 말 것.
# 공개가 필요하면 TLS(WSS) + 사용자 인증으로 바꾼 뒤 진행한다.
# ---------------------------------------------------------------------------
allow_anonymous true

# 콘솔로 바로 보이게 (-v 와 함께 사용)
log_dest stdout
log_type all
connection_messages true

# 파일 기반 영속 저장 불필요 (제어 스트림은 QoS 0)
persistence false
